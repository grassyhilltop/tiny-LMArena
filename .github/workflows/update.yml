name: Daily update

on:
  schedule:
    - cron: "17 11 * * *" # every day, 11:17 UTC
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Also publish a test alert (a pre-release; Buttondown gets a draft only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }} # the branch tip, not the commit that queued this run

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Refresh Artificial Analysis snapshot (only if AA_API_KEY is set)
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python scripts/aa_snapshot.py || echo "::warning::AA refresh failed; keeping the committed snapshot"

      - name: Fetch Epoch ECI data and recompute
        run: python scripts/update_data.py

      - name: Build page
        run: python scripts/build_page.py

      # Announce before committing: if the release fails, nothing is committed and tomorrow's run retries.
      - name: Announce events
        env:
          GH_TOKEN: ${{ github.token }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/send_alerts.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily data update $(date -u +%F)"
            git push
          fi

      - name: Test alert
        if: ${{ inputs.test_alert }}
        env:
          GH_TOKEN: ${{ github.token }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python scripts/send_alerts.py --test
